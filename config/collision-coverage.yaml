schema_version: 1
model_name: robotest
contact_topic: /robotest/validation/contacts
source_xacro: src/robotest_description/urdf/robotest.urdf.xacro

collision_geometries:
  - role: chassis
    link: base_footprint
    collision: base_footprint_fixed_joint_lump__base_link_collision_collision
    scoped_collision: >-
      robotest::base_footprint::base_footprint_fixed_joint_lump__base_link_collision_collision
    contact_sensor: chassis_contact_sensor
  - role: left_wheel
    link: left_wheel_link
    collision: left_wheel_link_fixed_joint_lump__left_wheel_collision_collision
    scoped_collision: >-
      robotest::left_wheel_link::left_wheel_link_fixed_joint_lump__left_wheel_collision_collision
    contact_sensor: left_wheel_contact_sensor
  - role: right_wheel
    link: right_wheel_link
    collision: right_wheel_link_fixed_joint_lump__right_wheel_collision_collision
    scoped_collision: >-
      robotest::right_wheel_link::right_wheel_link_fixed_joint_lump__right_wheel_collision_collision
    contact_sensor: right_wheel_contact_sensor
  - role: front_caster
    link: front_caster_link
    collision: front_caster_link_fixed_joint_lump__front_caster_collision_collision
    scoped_collision: >-
      robotest::front_caster_link::front_caster_link_fixed_joint_lump__front_caster_collision_collision
    contact_sensor: front_caster_contact_sensor
  - role: rear_caster
    link: rear_caster_link
    collision: rear_caster_link_fixed_joint_lump__rear_caster_collision_collision
    scoped_collision: >-
      robotest::rear_caster_link::rear_caster_link_fixed_joint_lump__rear_caster_collision_collision
    contact_sensor: rear_caster_contact_sensor
  - role: lidar_body
    link: lidar_link
    collision: lidar_link_collision_collision
    scoped_collision: robotest::lidar_link::lidar_link_collision_collision
    contact_sensor: lidar_body_contact_sensor
  - role: imu_body
    link: imu_link
    collision: imu_link_collision_collision
    scoped_collision: robotest::imu_link::imu_link_collision_collision
    contact_sensor: imu_body_contact_sensor

support_ground_exclusions:
  - robot_collision: >-
      robotest::left_wheel_link::left_wheel_link_fixed_joint_lump__left_wheel_collision_collision
    counterpart_collision: ground_plane::ground_link::ground_collision
  - robot_collision: >-
      robotest::right_wheel_link::right_wheel_link_fixed_joint_lump__right_wheel_collision_collision
    counterpart_collision: ground_plane::ground_link::ground_collision
  - robot_collision: >-
      robotest::front_caster_link::front_caster_link_fixed_joint_lump__front_caster_collision_collision
    counterpart_collision: ground_plane::ground_link::ground_collision
  - robot_collision: >-
      robotest::rear_caster_link::rear_caster_link_fixed_joint_lump__rear_caster_collision_collision
    counterpart_collision: ground_plane::ground_link::ground_collision
