[project]
name = "robotest-lab-tooling"
version = "0.1.0"
description = "Repository-local validation and reporting tooling for RoboTest Lab"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Hasan Ahmed" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests", "src"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "artifacts",
  "benchmarks/raw",
  "build",
  "install",
  "log",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "PERF", "RUF", "SIM", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/**/test/**/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]
