[flake8]
# Ruff is the repository's normative formatter and import sorter. The optional
# class-newline plugin requires blank lines that Ruff removes.
extend-ignore = B902,C816,CNL100,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
