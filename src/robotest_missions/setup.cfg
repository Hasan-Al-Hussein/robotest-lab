[develop]
script_dir=$base/lib/robotest_missions

[install]
install_scripts=$base/lib/robotest_missions

[flake8]
max-line-length = 100
# Ruff is the repository's normative import sorter. Its deterministic standard-
# library grouping differs from the legacy flake8-import-order plugin bundled by
# ament_flake8, so keep ament focused on syntax/style rather than a second sorter.
extend-ignore = I100,I101
