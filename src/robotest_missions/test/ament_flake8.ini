[flake8]
# Ruff is the repository's normative import sorter. Its deterministic import
# grouping differs from the legacy flake8-import-order plugin bundled in Jazzy.
extend-ignore = B902,C816,CNL100,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I100,I101,I202
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
