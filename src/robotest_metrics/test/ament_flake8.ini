[flake8]
max-line-length = 100
# Ruff is the normative import sorter. The legacy flake8-import-order plugin
# classifies every ROS and local import as a separate third-party group.
# Test names already describe behavior, so duplicate pydocstyle prose is not
# required for modules/functions in the test tree.
extend-ignore = D100,D103,I100,I101,I201
